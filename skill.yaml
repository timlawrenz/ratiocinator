id: timlawrenz.ratiocinator
name: Ratiocinator
description: >
  Autonomous scientific discovery pipeline that uses LLMs and tree search
  to propose hypotheses, run GPU experiments on Vast.ai or HuggingFace Jobs,
  and synthesize LaTeX/Markdown papers from results.
author: Tim Lawrenz
version: 1.0.0
icon: https://raw.githubusercontent.com/timlawrenz/ratiocinator/main/docs/icon.png
tags:
  - research
  - ml-experiments
  - gpu
  - autonomous-research
  - vast-ai
  - huggingface
  - tree-search
  - ablation
language: python
runtime: native

inputs:
  - name: spec_file
    type: string
    description: Path to YAML experiment or research spec file
    required: true
  - name: provider
    type: string
    description: "Infrastructure provider: 'vast' (default) or 'hf'"
    required: false
  - name: arms
    type: string
    description: "Comma-separated arm indices to run (e.g. '0,2,4')"
    required: false

outputs:
  - name: results
    type: object
    description: JSON results with per-arm metrics, duration, cost, and status

dependencies:
  - python>=3.11
  - ratiocinator (pip install ratiocinator)

permissions:
  - network (Vast.ai API or HuggingFace API)
  - docker (for local sandbox mode)
  - ssh (for Vast.ai provisioning)

examples:
  - input:
      command: "ratiocinator init"
    output:
      description: "Scaffolds research/specs/, research/results/, .ratiocinator/ directories"
  - input:
      command: "ratiocinator fleet run research/specs/experiment.yaml"
    output:
      description: "Runs all arms in parallel on Vast.ai, returns metrics JSON"
  - input:
      command: "ratiocinator research research/specs/research.yaml --hf"
    output:
      description: "Autonomous research loop on HuggingFace Jobs"
