# DINO-X Tier 2: LIDC-IDRI Loss Combination Sweep (ViT-Small)
#
# Tests DINO ± Gram ± KoLeo on actual medical imaging data using the fast
# ViT-Small config (~4x faster than ViT-Large). Requires a data server
# provisioned via: python scripts/dinox_data_server.py provision
#
# Launch:
#   ratiocinator fleet run specs/dinox/03_lidc_loss_sweep.yaml \
#     --data-server root@<data-server-ip>:/workspace/DINO-X/data
#
# Re-run failed arms:
#   ratiocinator fleet run specs/dinox/03_lidc_loss_sweep.yaml --arms 0,2,4

name: dinox-lidc-loss-sweep-vit-small

hardware:
  gpu: "RTX 4090"
  num_gpus: 1
  max_dph: 0.50
  image: pytorch/pytorch:2.7.0-cuda12.8-cudnn9-runtime

repo:
  url: https://github.com/timlawrenz/DINO-X.git
  branch: main

data:
  source: rsync
  rsync_server: "root@ssh2.vast.ai:/workspace/DINO-X/data"
  rsync_port: 15172
  target: /workspace/experiment/data

deps:
  pre_install:
    - "pip install --quiet numpy pillow pydicom tensorboard"
  verify: "python -c \"import torch; assert torch.cuda.is_available(); from pathlib import Path; idx = Path('data/processed/lidc-idri/_index/index.csv'); assert idx.exists(), 'Missing index'; print('OK')\""

arms:
  # ── A: DINO only ──
  - name: dino_only
    description: "DINO loss only, ViT-Small, 2000 steps"
    command: |-
      python scripts/phase5_big_run.py \
        --config vit-small \
        --max-steps 2000 \
        --batch-size 64 \
        --accumulation-steps 4 \
        --lr 2e-4 \
        --warmup-steps 200 \
        --teacher-temp 0.04 \
        --ema 0.996 \
        --gram-weight 0.0 \
        --koleo-weight 0.0 \
        --loss-type dino \
        --ckpt-every 500 \
        --amp \
        --run-suffix dino_only \
        --index-csv data/processed/lidc-idri/_index/index.csv \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --seed 42 &&
      CKPT=$(find data/runs -name 'checkpoint_*.pth' | sort | tail -1) &&
      (python scripts/phase5_view_retrieval_eval.py \
        --checkpoint "$CKPT" \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --n 2048 --seed 42 || true) &&
      RETR=$(find data/runs -name 'view_retrieval_*.json' | sort | tail -1) &&
      python -c "
      import json
      r = json.loads(open('$RETR').read())
      m = dict(retrieval_top1=r.get('top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), loss_config='dino_only', gram_weight=0.0, koleo_weight=0.0)
      print('METRICS:' + json.dumps(m))
      "

  # ── B: DINO + Gram ──
  - name: dino_gram
    description: "DINO + Gram anchoring (w=1.0), ViT-Small"
    command: |-
      python scripts/phase5_big_run.py \
        --config vit-small \
        --max-steps 2000 \
        --batch-size 64 \
        --accumulation-steps 4 \
        --lr 2e-4 \
        --warmup-steps 200 \
        --teacher-temp 0.04 \
        --ema 0.996 \
        --gram-weight 1.0 \
        --koleo-weight 0.0 \
        --loss-type dino \
        --ckpt-every 500 \
        --amp \
        --run-suffix dino_gram \
        --index-csv data/processed/lidc-idri/_index/index.csv \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --seed 42 &&
      CKPT=$(find data/runs -name 'checkpoint_*.pth' | sort | tail -1) &&
      (python scripts/phase5_view_retrieval_eval.py \
        --checkpoint "$CKPT" \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --n 2048 --seed 42 || true) &&
      RETR=$(find data/runs -name 'view_retrieval_*.json' | sort | tail -1) &&
      python -c "
      import json
      r = json.loads(open('$RETR').read())
      m = dict(retrieval_top1=r.get('top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), loss_config='dino_gram', gram_weight=1.0, koleo_weight=0.0)
      print('METRICS:' + json.dumps(m))
      "

  # ── C: DINO + KoLeo ──
  - name: dino_koleo
    description: "DINO + KoLeo regularization (w=0.1), ViT-Small"
    command: |-
      python scripts/phase5_big_run.py \
        --config vit-small \
        --max-steps 2000 \
        --batch-size 64 \
        --accumulation-steps 4 \
        --lr 2e-4 \
        --warmup-steps 200 \
        --teacher-temp 0.04 \
        --ema 0.996 \
        --gram-weight 0.0 \
        --koleo-weight 0.1 \
        --loss-type dino \
        --ckpt-every 500 \
        --amp \
        --run-suffix dino_koleo \
        --index-csv data/processed/lidc-idri/_index/index.csv \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --seed 42 &&
      CKPT=$(find data/runs -name 'checkpoint_*.pth' | sort | tail -1) &&
      (python scripts/phase5_view_retrieval_eval.py \
        --checkpoint "$CKPT" \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --n 2048 --seed 42 || true) &&
      RETR=$(find data/runs -name 'view_retrieval_*.json' | sort | tail -1) &&
      python -c "
      import json
      r = json.loads(open('$RETR').read())
      m = dict(retrieval_top1=r.get('top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), loss_config='dino_koleo', gram_weight=0.0, koleo_weight=0.1)
      print('METRICS:' + json.dumps(m))
      "

  # ── D: DINO + Gram + KoLeo ──
  - name: dino_gram_koleo
    description: "DINO + Gram(1.0) + KoLeo(0.1), ViT-Small"
    command: |-
      python scripts/phase5_big_run.py \
        --config vit-small \
        --max-steps 2000 \
        --batch-size 64 \
        --accumulation-steps 4 \
        --lr 2e-4 \
        --warmup-steps 200 \
        --teacher-temp 0.04 \
        --ema 0.996 \
        --gram-weight 1.0 \
        --koleo-weight 0.1 \
        --loss-type dino \
        --ckpt-every 500 \
        --amp \
        --run-suffix dino_gram_koleo \
        --index-csv data/processed/lidc-idri/_index/index.csv \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --seed 42 &&
      CKPT=$(find data/runs -name 'checkpoint_*.pth' | sort | tail -1) &&
      (python scripts/phase5_view_retrieval_eval.py \
        --checkpoint "$CKPT" \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --n 2048 --seed 42 || true) &&
      RETR=$(find data/runs -name 'view_retrieval_*.json' | sort | tail -1) &&
      python -c "
      import json
      r = json.loads(open('$RETR').read())
      m = dict(retrieval_top1=r.get('top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), loss_config='dino_gram_koleo', gram_weight=1.0, koleo_weight=0.1)
      print('METRICS:' + json.dumps(m))
      "

  # ── E: SimCLR only (no DINO) ──
  - name: simclr_only
    description: "SimCLR loss only (contrastive baseline), ViT-Small"
    command: |-
      python scripts/phase5_big_run.py \
        --config vit-small \
        --max-steps 2000 \
        --batch-size 64 \
        --accumulation-steps 4 \
        --lr 2e-4 \
        --warmup-steps 200 \
        --gram-weight 0.0 \
        --koleo-weight 0.0 \
        --loss-type simclr \
        --ckpt-every 500 \
        --amp \
        --run-suffix simclr_only \
        --index-csv data/processed/lidc-idri/_index/index.csv \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --seed 42 &&
      CKPT=$(find data/runs -name 'checkpoint_*.pth' | sort | tail -1) &&
      (python scripts/phase5_view_retrieval_eval.py \
        --checkpoint "$CKPT" \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --n 2048 --seed 42 || true) &&
      RETR=$(find data/runs -name 'view_retrieval_*.json' | sort | tail -1) &&
      python -c "
      import json
      r = json.loads(open('$RETR').read())
      m = dict(retrieval_top1=r.get('top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), loss_config='simclr_only', gram_weight=0.0, koleo_weight=0.0)
      print('METRICS:' + json.dumps(m))
      "

  # ── F: SimCLR + Gram ──
  - name: simclr_gram
    description: "SimCLR + Gram anchoring (w=1.0), ViT-Small"
    command: |-
      python scripts/phase5_big_run.py \
        --config vit-small \
        --max-steps 2000 \
        --batch-size 64 \
        --accumulation-steps 4 \
        --lr 2e-4 \
        --warmup-steps 200 \
        --gram-weight 1.0 \
        --koleo-weight 0.0 \
        --loss-type simclr \
        --ckpt-every 500 \
        --amp \
        --run-suffix simclr_gram \
        --index-csv data/processed/lidc-idri/_index/index.csv \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --seed 42 &&
      CKPT=$(find data/runs -name 'checkpoint_*.pth' | sort | tail -1) &&
      (python scripts/phase5_view_retrieval_eval.py \
        --checkpoint "$CKPT" \
        --split-manifest data/processed/_splits/val10_seed42.json \
        --n 2048 --seed 42 || true) &&
      RETR=$(find data/runs -name 'view_retrieval_*.json' | sort | tail -1) &&
      python -c "
      import json
      r = json.loads(open('$RETR').read())
      m = dict(retrieval_top1=r.get('top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), loss_config='simclr_gram', gram_weight=1.0, koleo_weight=0.0)
      print('METRICS:' + json.dumps(m))
      "

metrics:
  protocol: json_line
  json_prefix: "METRICS:"

preflight:
  command: |-
    python scripts/phase5_big_run.py \
      --config vit-small \
      --max-steps 5 \
      --batch-size 4 \
      --loss-type dino \
      --ckpt-every 999999 \
      --index-csv data/processed/lidc-idri/_index/index.csv \
      --split-manifest data/processed/_splits/val10_seed42.json \
      --run-suffix preflight
  timeout_s: 120
  check_metrics: false

budget:
  max_dollars: 15.00
  train_timeout_s: 3600
  download_timeout_s: 7200
  instance_ttl_s: 7200
