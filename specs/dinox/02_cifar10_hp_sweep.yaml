metrics:
  protocol: json_line
  json_prefix: "METRICS:"

preflight:
  command: "python -c \"import torch; assert torch.cuda.is_available(); from scripts.baseline_cifar10_pretrain import main; print('preflight ok')\""
  timeout_s: 60
  check_metrics: false

budget:
  max_dollars: 20.00
  train_timeout_s: 3600
  download_timeout_s: 600
  instance_ttl_s: 5400
