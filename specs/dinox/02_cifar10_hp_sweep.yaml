      python -c "
      import json, glob
      p = json.loads(open(sorted(glob.glob('data/runs/baseline_cifar10/*/linear_probe_*.json'))[-1]).read())
      r = json.loads(open(sorted(glob.glob('data/runs/baseline_cifar10/*/cifar_view_retrieval_*.json'))[-1]).read())
      m = dict(test_top1=p.get('test_top1', -1), retrieval_ratio=r.get('ratio_vs_random', -1), lr=2e-5, temp=0.04, gram=False)
      print('METRICS:' + json.dumps(m))
      "

  - name: lr5e-5_temp04
