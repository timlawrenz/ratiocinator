[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratiocinator"
version = "0.1.0"
description = "Distributed scientific discovery pipeline using Agentic Tree Search"
readme = "reatiocinator.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "click>=8.1",
    "pydantic>=2.0",
    "docker>=7.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ideation = [
    "arxiv>=2.1",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
synthesis = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
ratiocinator = "ratiocinator.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
